name: fcm_workspace
description: Dart pub workspace root for the FCM sample app. Not a real package — it exists to give every member a single shared dependency resolution.
publish_to: none

environment:
  sdk: ^3.12.2

# Every member listed here shares one pubspec.lock and one .dart_tool at the
# repo root, so `melos bootstrap` is a single `pub get` instead of one per
# package. Members opt in with `resolution: workspace` in their own pubspec.
workspace:
  - apps/fcm_api
  - apps/fcm_app
  - packages/fcm_gallery_shared

dev_dependencies:
  melos: ^8.2.2

# One shared resolution means one cli_util, and the two tools that want it
# disagree: melos 8 requires ^0.5.0, while every drift_dev that can be resolved
# here at all caps it at ^0.4.0. The override picks melos's, because 0.5.0 only
# added `BaseDirectories` and deprecated `applicationConfigHome` — nothing
# drift_dev calls was removed — so drift_dev runs unchanged against it.
#
# Overrides live only at the workspace root; pub refuses them in a member.
dependency_overrides:
  cli_util: ^0.5.0

# Melos 8 reads its configuration from the pub workspace root, not melos.yaml.
# Every script shells out through `fvm` so the SDK pinned in .fvmrc is used,
# regardless of which Flutter happens to be on PATH.
melos:
  scripts:
    analyze:
      description: Run the Dart analyzer over every package, treating infos as failures.
      exec: fvm dart analyze --fatal-infos --fatal-warnings .

    dcm:
      description: Run DCM over the whole workspace.
      # `fvm exec` rather than `fvm dcm` — fvm only proxies dart and flutter, so
      # third-party tools go through exec, which puts the pinned SDK on PATH.
      run: fvm exec dcm analyze --fatal-style --fatal-warnings .

    format:
      description: Format all Dart sources in place.
      run: fvm dart format .

    format:check:
      description: Fail if any Dart source is not formatted.
      run: fvm dart format --output=none --set-exit-if-changed .

    fix:
      description: Apply automated analyzer fixes in every package.
      exec: fvm dart fix --apply

    generate:
      description: Regenerate Drift's database code. Run after changing a table.
      # Not part of `ci`: the generated files are committed, so a fresh clone
      # analyses and tests without a codegen step. The cost is remembering to
      # run this whenever a table changes.
      #
      # No `--delete-conflicting-outputs`: build_runner 2.15 removed the option
      # and warns that it was ignored. Outputs are written beside their source
      # and overwritten in place, so there is nothing left to clear.
      exec: fvm dart run build_runner build
      packageFilters:
        dependsOn: drift_dev

    l10n:
      description: >-
        Regenerate the typed translations from
        apps/fcm_app/lib/i18n/strings.i18n.csv. Run after editing the CSV.
      # Not part of `ci`, for the same reason `generate` is not: the output is
      # committed, so a fresh clone analyses and tests without a codegen step. The
      # forgotten-regeneration case is caught by test/i18n/csv_coverage_test.dart
      # instead, which is where the person who forgot will be looking.
      run: |
        cd apps/fcm_app || exit 1
        fvm dart run slang

    api:serve:
      description: >-
        Run the send API on 127.0.0.1:8080. Needs GOOGLE_APPLICATION_CREDENTIALS
        pointing at a Firebase service account key — see apps/fcm_api/README.md.
      run: fvm dart run apps/fcm_api/bin/server.dart

    test:core:
      description: Run pure-Dart tests (no Flutter binding required).
      exec: fvm dart test
      packageFilters:
        flutter: false
        dirExists: test

    test:app:
      description: Run Flutter widget tests.
      exec: fvm flutter test
      packageFilters:
        flutter: true
        dirExists: test

    test:e2e:
      description: >-
        End-to-end Patrol suite against a connected Android device. Needs the API
        running (melos run api:serve) with GOOGLE_APPLICATION_CREDENTIALS set, and
        — on a physical handset — adb reverse tcp:8080 tcp:8080. Deliberately not
        part of `ci`, which stays hermetic and device-free. Set FCM_API_BASE_URL to
        http://10.0.2.2:8080 for the emulator.
      run: |
        cd apps/fcm_app || exit 1
        # `patrol test` leaves a generated patrol_test/ behind, and dart format
        # walks it regardless of .gitignore — clean it up on a normal exit AND on
        # Ctrl-C during a long device run, so neither path leaves format:check
        # broken for the next person.
        trap 'rm -rf patrol_test' EXIT INT TERM
        status=0
        # One `patrol test` invocation per target rather than one call with
        # `--target` repeated eleven times, even though the latter is supported
        # and would build once: a target per invocation isolates one group's
        # failure from the other ten, which is the trade `CALIBRATION.md` advises
        # running one group at a time for.
        for target in integration_test/group_*_test.dart; do
          fvm exec patrol test --target "$target" \
            --dart-define=FCM_API_BASE_URL="${FCM_API_BASE_URL:-http://localhost:8080}" \
            || status=1
        done
        exit $status

    test:
      description: Run every test suite in the workspace.
      steps:
        - test:core
        - test:app

    ci:
      description: The full gate — formatting, analyzer, DCM, then tests.
      steps:
        - format:check
        - analyze
        - dcm
        - test
