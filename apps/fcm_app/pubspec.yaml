name: fcm_app
description: Sample Flutter app that receives Firebase Cloud Messaging pushes and lists them.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  core:
    path: ../../packages/core
  cupertino_icons: ^1.0.8
  fcm_gallery_shared:
    path: ../../packages/fcm_gallery_shared
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
