name: fcm_app
description: Sample Flutter app that receives Firebase Cloud Messaging pushes and lists them.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  core:
    path: ../../packages/core
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
